name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-plugins
      - name: Unit tests
        run: composer test
      - name: Scrub check (no em-dash)
        run: composer scrub:check

  # The wp.org submission gate. Plugin Check is installed from wordpress.org on
  # every run, so this tracks the rules wp.org actually enforces rather than a
  # pinned copy of them. --ignore-calendar drops the one code whose input is the
  # clock; the wporg-currency workflow owns that one.
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: wp.org Plugin Check
        run: ./plugin-check/run.sh --ignore-calendar

  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: WordPress coding standards (security + i18n)
        run: composer phpcs